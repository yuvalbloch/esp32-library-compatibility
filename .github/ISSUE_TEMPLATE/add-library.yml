name: Add a library
description: Ask for a library to be tested
title: "Add library: "
labels: ["add-library"]
body:
  - type: input
    id: name
    attributes:
      label: Library name
      description: Exactly as shown in the Arduino Library Manager
      placeholder: e.g. Adafruit GFX Library
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository URL
      placeholder: https://github.com/...
  - type: checkboxes
    id: chips
    attributes:
      label: Chips you use it with
      options:
        - label: ESP32
        - label: ESP32-S3
        - label: ESP32-C3
        - label: Other (S2, C6, H2, P4, C5)
  - type: textarea
    id: why
    attributes:
      label: Anything we should know?
      description: e.g. a known problem on core 4.0, or which example sketch is most representative
