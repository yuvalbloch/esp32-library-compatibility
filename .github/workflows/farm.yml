name: Compile farm

# Plan -> compile in parallel chunks (one core per machine) -> merge, save to the `results` branch, deploy the site.
# Runs daily (new library releases only) and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these libraries (comma-separated names; empty = all)"
        default: ""
      cores:
        description: "Only these cores (space-separated; empty = all)"
        default: ""
      latest_only:
        description: "Only the newest version of each library"
        type: boolean
        default: false
      chunk_size:
        description: "Compiles per machine (smaller = more machines)"
        default: "60"
      replan:
        description: "Rebuild the test plan from scratch (after changing example picks)"
        type: boolean
        default: false
      invalidate_headers:
        description: "Farm-bug correction: recompile failures caused by these missing headers (space-separated; see methodology)"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write       # the "Farm status" issue
  actions: write      # keep-alive: re-enable this workflow so GitHub never pauses the schedule

concurrency:
  group: compile-farm
  cancel-in-progress: false

env:
  ESP32FARM: /home/runner/esp32farm
  PYTHONUNBUFFERED: "1"
  ONLY: ${{ inputs.only }}
  CORES: ${{ inputs.cores }}
  LATEST_ONLY: ${{ inputs.latest_only && '--latest-only' || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Load previous results
        run: python farm/ci.py load-state
      - name: Farm-bug correction
        if: inputs.invalidate_headers != ''
        run: python farm/invalidate.py --missing-header ${{ inputs.invalidate_headers }}
      - name: Plan (new library releases, or a fresh plan)
        run: |
          if [ -f "$ESP32FARM/plan.json" ] && [ "${{ inputs.replan }}" != "true" ]; then
            python farm/update.py --plan-only
          else
            python farm/prepare.py --refresh
          fi
      - name: Split pending compiles into chunks
        id: matrix
        run: |
          ARGS="$LATEST_ONLY"
          [ -n "$CORES" ] && ARGS="$ARGS --cores $CORES"
          if [ -n "$ONLY" ]; then
            M=$(python farm/run.py --retry-infra --list-pending "${{ inputs.chunk_size || '60' }}" $ARGS --only "$ONLY")
          else
            M=$(python farm/run.py --retry-infra --list-pending "${{ inputs.chunk_size || '60' }}" $ARGS)
          fi
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "$M"
      - name: Pack plan state
        run: |
          python farm/ci.py ensure-state
          tar -C "$ESP32FARM" -czf state.tgz plan.json results.db cores.json news.json dl/library_index.json
      - uses: actions/upload-artifact@v7
        with:
          name: state
          path: state.tgz
          retention-days: 7

  compile:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: compile ${{ matrix.core }} (${{ matrix.shard }}/${{ matrix.nshards }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: state
      - name: Free disk space (cores need ~10 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Unpack plan state
        run: mkdir -p "$ESP32FARM" && tar -C "$ESP32FARM" -xzf state.tgz
      - name: Install arduino-cli and core ${{ matrix.core }}
        # pyserial: older cores run esptool.py (which imports it) to package the firmware on Linux
        run: |
          python -m pip install --quiet pyserial
          python farm/setup_cores.py ${{ matrix.core }}
      - name: Compile
        run: |
          python farm/ci.py maxid > maxid.txt
          ARGS="$LATEST_ONLY"
          if [ -n "$ONLY" ]; then
            python farm/run.py --retry-infra --workers 4 --cores ${{ matrix.core }} --shard ${{ matrix.shard }}/${{ matrix.nshards }} $ARGS --only "$ONLY"
          else
            python farm/run.py --retry-infra --workers 4 --cores ${{ matrix.core }} --shard ${{ matrix.shard }}/${{ matrix.nshards }} $ARGS
          fi
      - name: Pack results
        if: always()
        run: python farm/ci.py pack-results out "$(cat maxid.txt)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: res-${{ matrix.core }}-${{ matrix.shard }}
          path: out
          retention-days: 7

  publish:
    needs: [plan, compile]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Load previous logs
        run: python farm/ci.py load-state --logs
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Merge results
        run: |
          # download-artifact v5+ unpacks a lone artifact straight into artifacts/ (no-compile nights)
          STATE=artifacts/state/state.tgz; [ -f "$STATE" ] || STATE=artifacts/state.tgz
          tar -C "$ESP32FARM" -xzf "$STATE"
          python farm/ci.py maxid > before.txt
          python farm/ci.py merge-results artifacts/res-*
      - name: Apply the current classification rules to stored logs
        run: python farm/reclassify.py
      - name: Nightly report (What's new, regressions)
        run: python farm/report.py --since "$(cat before.txt)" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Save results to the results branch
        run: python farm/ci.py save-state
      - name: Build site
        run: python farm/export.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # GitHub sometimes can't see the just-uploaded site for a few seconds
      # ("No artifacts named github-pages"), so a failed deploy is retried once after a pause.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying the site deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Update the "Farm status" issue (comment = email only when something needs attention)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --limit 50 --json number,title -q '.[] | select(.title=="Farm status") | .number' | head -1)
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "Farm status" --body-file "$ESP32FARM/report.md" | grep -oE '[0-9]+$')
          else
            gh issue edit "$NUM" --body-file "$ESP32FARM/report.md"
          fi
          if [ -f "$ESP32FARM/alert.md" ]; then
            printf '@yuvalbloch ' | cat - "$ESP32FARM/alert.md" > alert.md
            gh issue comment "$NUM" --body-file alert.md
          fi
      - name: Keep the nightly schedule alive (GitHub pauses schedules after 60 days without activity)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/farm.yml/enable"

  notify-failure:
    needs: [plan, compile, publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report the failed run on the "Farm status" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --state open --limit 50 --json number,title -q '.[] | select(.title=="Farm status") | .number' | head -1)
          [ -z "$NUM" ] && NUM=$(gh issue create --title "Farm status" --body "Created by the compile farm." | grep -oE '[0-9]+$')
          gh issue comment "$NUM" --body "@yuvalbloch Tonight's farm run had a problem: $URL (results already published stay as they are; Claude can look at the log)."
